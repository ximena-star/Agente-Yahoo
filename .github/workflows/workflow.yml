name: Stock Agent

on:
  schedule:
    - cron: '0 11 * * 1-5'
    - cron: '12 12 * * 1-5'
    - cron: '24 13 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '0 19 * * 1-5'
    - cron: '0 21 * * 1-5'
    - cron: '0 23 * * 1-5'
    - cron: '0 2 * * 2-6'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance groq feedparser schedule

      - name: Crear config.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO_1: ${{ secrets.EMAIL_TO_1 }}
          EMAIL_TO_2: ${{ secrets.EMAIL_TO_2 }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python - <<PYEOF
          import os
          content = f"""CONFIG = {{
              "GROQ_API_KEY":  "{os.environ['GROQ_API_KEY']}",
              "EMAIL_FROM":    "{os.environ['EMAIL_FROM']}",
              "EMAIL_TO":      ["{os.environ['EMAIL_TO_1']}", "{os.environ['EMAIL_TO_2']}"],
              "SMTP_PASSWORD": "{os.environ['SMTP_PASSWORD']}",
              "SMTP_HOST":     "smtp.gmail.com",
              "SMTP_PORT":     465,
          }}"""
          with open("config.py", "w") as f:
              f.write(content)
          print("config.py creado OK")
          PYEOF

      - name: Ejecutar Stock Agent
        run: |
          python - <<PYEOF
          from stock_agent import fetch_market_data, fetch_all_news, generate_ai_analysis, build_email_html, send_email
          import os
          n = int(os.environ.get('GITHUB_RUN_NUMBER', 1))
          data     = fetch_market_data()
          news     = fetch_all_news()
          analysis = generate_ai_analysis(data, news)
          html, plain = build_email_html(data, analysis, news, n)
          send_email(html, plain, n)
          print(f'Update completado')
          PYEOF
